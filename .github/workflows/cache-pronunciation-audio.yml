name: Cache pronunciation audio

on:
  push:
    branches:
      - feature/chinese-translations
    paths:
      - "scripts/download_pronunciations.py"
      - "pronunciation-en.js"
      - ".github/workflows/cache-pronunciation-audio.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download-audio:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/chinese-translations
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download English pronunciation recordings
        run: python3 scripts/download_pronunciations.py

      - name: Commit audio assets and attribution manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pronunciation-audio/
          if ! git diff --cached --quiet; then
            git commit -m "Cache English pronunciation audio assets"
            git push origin HEAD:feature/chinese-translations
          else
            echo "Pronunciation assets are already up to date."
          fi
